name: Runtime path tests

on:
  pull_request:
  push:
    branches:
      - agent/portable-runtime-paths

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen --python 3.12
      - name: Run runtime path tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Compile Dispatcher entry points
        run: uv run --frozen python -m py_compile src/dispatcher.py src/dispatcher_core.py src/runtime_paths.py src/engine_environment.py
      - name: Verify generated ContextCanon output
        run: |
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@4f007eb9a2596a905cd716e2bbefe2351cd4ecdf contextcanon build .
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@4f007eb9a2596a905cd716e2bbefe2351cd4ecdf contextcanon check .
          git diff --exit-code

name: Runtime path tests

on:
  pull_request:
  push:
    branches:
      - agent/portable-runtime-paths

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8  # Windows runner console defaults to cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen --python 3.12
      - name: Run runtime path tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Compile Dispatcher entry points
        run: uv run --frozen python -m py_compile src/dispatcher.py src/dispatcher_core.py src/runtime_paths.py src/engine_environment.py
      - name: Verify generated ContextCanon output
        if: runner.os == 'Linux'
        run: |
          # Use the compiler for the accepted ContextCanon v0.8 package format.
          # The Parent is already adopted and committed: CI must not re-adopt or propagate it.
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@812d03d25e2f92e995103ebfb82f5f9ae9c67995 contextcanon build --all .
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@812d03d25e2f92e995103ebfb82f5f9ae9c67995 contextcanon check --all .
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

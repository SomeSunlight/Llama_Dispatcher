name: Runtime path tests

on:
  pull_request:
  push:
    branches:
      - agent/portable-runtime-paths

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8  # Windows runner console defaults to cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen --python 3.12
      - name: Run runtime path tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Compile Dispatcher entry points
        run: uv run --frozen python -m py_compile src/dispatcher.py src/dispatcher_core.py src/runtime_paths.py src/engine_environment.py scripts/s03_live_smoke.py
      - name: Check S03 native Windows runner PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @(
            'scripts/Filesystem.ps1',
            'tests/s03_cleanup.ps1',
            'scripts/s03_speedy_smoke.ps1',
            'scripts/s03_speedy_gateway.ps1',
            'scripts/s03_caddy_gateway.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Verify bounded native Windows S03 cleanup (no live service)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/s03_cleanup.ps1
      - name: S03 Caddy gateway dry-run (synthetic only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 's03-test-Caddyfile'
          $sample = @'
          example.test {
            @unauthorizedAI {
              path /v1/* /strata/v1/*
              not header Authorization "Bearer {$SPEEDY_API_KEY}"
            }
            route {
              handle /strata/v1/* {
                reverse_proxy 127.0.0.1:8080
              }
              handle /v1/* {
                reverse_proxy 127.0.0.1:8001 {
                  header_up -Authorization
                }
              }
            }
          }
          '@
          [IO.File]::WriteAllText($fixture, ($sample -replace "`r?`n", "`r`n"))
          $before = [IO.File]::ReadAllText($fixture)
          ./scripts/s03_caddy_gateway.ps1 -Caddyfile $fixture
          if ([IO.File]::ReadAllText($fixture) -cne $before) {
            throw 'S03 Caddy dry-run mutated the fixture.'
          }
          $forwarded = $before.Replace(
            'header_up -Authorization',
            'header_up Authorization {http.request.header.Authorization}'
          )
          [IO.File]::WriteAllText($fixture, $forwarded)
          ./scripts/s03_caddy_gateway.ps1 -Caddyfile $fixture -Revert
          if ([IO.File]::ReadAllText($fixture) -cne $forwarded) {
            throw 'S03 Caddy -Revert dry-run mutated the fixture.'
          }
          [IO.File]::WriteAllText($fixture, 'unexpected unrelated file')
          $failed = $false
          try { ./scripts/s03_caddy_gateway.ps1 -Caddyfile $fixture }
          catch { $failed = $true }
          if (-not $failed) { throw 'S03 Caddy accepted an unrelated Caddyfile.' }
      - name: Verify generated ContextCanon output
        if: runner.os == 'Linux'
        run: |
          # Use the compiler for the accepted ContextCanon v0.8 package format.
          # The Parent is already adopted and committed: CI must not re-adopt or propagate it.
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@812d03d25e2f92e995103ebfb82f5f9ae9c67995 contextcanon build --all .
          uvx --from git+https://github.com/SomeSunlight/context-canon.git@812d03d25e2f92e995103ebfb82f5f9ae9c67995 contextcanon check --all .
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
